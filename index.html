<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon Arcade – jeux gratuits dans le navigateur</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F6FF;--surface:#FFFFFF;--ink:#14173D;--muted:#575C8C;--blue:#3347FF;--sun:#FFB020;--mint:#12B886;--line:#DCE2FF;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1130;--surface:#181C4A;--ink:#EEF0FF;--muted:#A8AEE0;--blue:#7D8BFF;--line:#2B3070;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1130;--surface:#181C4A;--ink:#EEF0FF;--muted:#A8AEE0;--blue:#7D8BFF;--line:#2B3070;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.55 Figtree,system-ui,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
header{display:flex;align-items:center;gap:10px;padding:18px 0}
.logo{font:700 1.4rem Fredoka,system-ui,sans-serif;letter-spacing:.2px}
.logo i{font-style:normal;display:inline-block;background:var(--sun);color:#14173D;border-radius:10px;padding:0 8px;margin-right:6px;transform:rotate(-6deg)}
h1{font:700 clamp(2.2rem,8vw,4rem)/1.05 Fredoka,system-ui,sans-serif;margin:28px 0 12px;max-width:14ch}
.lead{color:var(--muted);max-width:46ch;margin:0 0 26px;font-size:1.1rem}
.ad{display:grid;place-items:center;min-height:90px;margin:26px 0;border:2px dashed var(--line);border-radius:14px;color:var(--muted);font-size:.85rem}
h2{font:700 1.5rem Fredoka,system-ui,sans-serif;margin:34px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.tile-art{display:grid;place-items:center;height:120px;font-size:3.4rem}
.card div.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{margin:0;font:700 1.2rem Fredoka,system-ui,sans-serif}
.card p{margin:0 0 8px;color:var(--muted);font-size:.95rem;flex:1}
.btn{font:600 1rem Figtree,system-ui,sans-serif;cursor:pointer;border:0;border-radius:12px;padding:10px 16px;background:var(--blue);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
:root[data-theme="dark"] .btn:not(.ghost){color:#0E1130}
.btn:focus-visible,.tile:focus-visible,.target:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
footer{padding:30px 0 40px;color:var(--muted);font-size:.9rem}
dialog{border:0;border-radius:22px;padding:0;width:min(520px,94vw);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,12,40,.65)}
.bar{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.bar strong{font:700 1.2rem Fredoka,system-ui,sans-serif}
#stage{padding:18px}
#stage iframe{width:100%;height:60vh;border:0;border-radius:12px}
.stats{display:flex;gap:18px;margin:0 0 12px}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{aspect-ratio:1;border:0;border-radius:14px;background:var(--blue);font-size:2rem;cursor:pointer}
.tile.up{background:var(--bg);border:2px solid var(--line)}
.arena{position:relative;height:280px;border-radius:16px;background:var(--bg);border:2px solid var(--line);margin-bottom:12px;overflow:hidden}
.target{position:absolute;width:56px;height:56px;border:0;border-radius:50%;background:var(--sun);font-size:1.6rem;cursor:pointer}
#msg{min-height:1.5em;margin:12px 0 0;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><i>▶</i>Mon Arcade</div>
  </header>

  <h1>Des jeux gratuits, sans rien télécharger.</h1>
  <p class="lead">Choisis un jeu et joue tout de suite, sur ton téléphone ou ton ordinateur.</p>

  <!-- Espace publicitaire 1 : colle ici ton code Adsterra / AdSense -->
  <aside class="ad" aria-label="Publicité">Espace publicitaire</aside>

  <h2>Tous les jeux</h2>
  <section class="grid" id="games" aria-label="Liste des jeux"></section>

  <!-- Espace publicitaire 2 -->
  <aside class="ad" aria-label="Publicité">Espace publicitaire</aside>

  <footer>© Mon Arcade. Nouveaux jeux bientôt.</footer>
</div>

<dialog id="dlg" aria-labelledby="gt">
  <div class="bar"><strong id="gt"></strong><button class="btn ghost" id="close">Fermer</button></div>
  <div id="stage"></div>
</dialog>

<script>
/* Pour ajouter un jeu : copie une ligne ci-dessous.
   - jeu intégré : run: nomDeFonction
   - jeu dans un fichier à part : url: 'jeux/mon-jeu.html' */
const GAMES=[
  {title:'Mémoire',emoji:'🧠',color:'#3347FF',desc:'Retrouve toutes les paires en un minimum de coups.',run:memory},
  {title:'Réflexe',emoji:'🎯',color:'#FFB020',desc:'Touche un maximum de cibles en 20 secondes.',run:reflex}
];

const grid=document.getElementById('games'),dlg=document.getElementById('dlg'),stage=document.getElementById('stage');
let stopCurrent=null;
GAMES.forEach(g=>{
  const c=document.createElement('article');c.className='card';
  c.innerHTML='<div class="tile-art" style="background:'+g.color+'33">'+g.emoji+'</div><div class="body"><h3>'+g.title+'</h3><p>'+g.desc+'</p><button class="btn">Jouer</button></div>';
  c.querySelector('button').onclick=()=>openGame(g);
  grid.appendChild(c);
});
function openGame(g){
  document.getElementById('gt').textContent=g.title;
  stage.innerHTML='';
  if(g.url){const f=document.createElement('iframe');f.src=g.url;f.title=g.title;stage.appendChild(f);}
  else stopCurrent=g.run(stage)||null;
  dlg.showModal();
}
function closeGame(){if(stopCurrent){stopCurrent();stopCurrent=null}stage.innerHTML='';dlg.close()}
document.getElementById('close').onclick=closeGame;
dlg.addEventListener('cancel',e=>{e.preventDefault();closeGame()});

function memory(el){
  const em=['🦁','🐘','🦒','🐢','🦜','🐠'];
  const deck=[...em,...em].sort(()=>Math.random()-.5);
  let first=null,lock=false,moves=0,found=0;
  el.innerHTML='<p class="stats">Coups : <b id="mv">0</b></p><div class="mem"></div><p id="msg" role="status"></p>';
  const box=el.querySelector('.mem'),mv=el.querySelector('#mv'),msg=el.querySelector('#msg');
  deck.forEach(e=>{
    const b=document.createElement('button');
    b.className='tile';b.setAttribute('aria-label','Carte cachée');
    b.onclick=()=>{
      if(lock||b.classList.contains('up'))return;
      b.classList.add('up');b.textContent=e;
      if(!first){first=b;return}
      moves++;mv.textContent=moves;
      if(first.textContent===e){first=null;found++;if(found===6)msg.textContent='Bravo ! Terminé en '+moves+' coups.'}
      else{lock=true;const a=first;first=null;setTimeout(()=>{a.classList.remove('up');a.textContent='';b.classList.remove('up');b.textContent='';lock=false},700)}
    };
    box.appendChild(b);
  });
}

function reflex(el){
  let score=0,left=20,timer=null;
  el.innerHTML='<p class="stats"><span>Score : <b id="sc">0</b></span><span>Temps : <b id="tm">20</b> s</span></p><div class="arena" id="ar"></div><button class="btn" id="go">Commencer</button><p id="msg" role="status"></p>';
  const ar=el.querySelector('#ar'),sc=el.querySelector('#sc'),tm=el.querySelector('#tm'),msg=el.querySelector('#msg'),go=el.querySelector('#go');
  function place(t){t.style.left=Math.random()*(ar.clientWidth-56)+'px';t.style.top=Math.random()*(ar.clientHeight-56)+'px'}
  function end(){
    clearInterval(timer);timer=null;ar.innerHTML='';go.disabled=false;go.textContent='Rejouer';
    let best=0;try{best=+localStorage.getItem('arcade-reflex-best')||0;if(score>best){best=score;localStorage.setItem('arcade-reflex-best',best)}}catch(e){best=Math.max(best,score)}
    msg.textContent='Fini ! Score : '+score+'. Meilleur score : '+best+'.';
  }
  go.onclick=()=>{
    score=0;left=20;sc.textContent=0;tm.textContent=20;msg.textContent='';go.disabled=true;ar.innerHTML='';
    const t=document.createElement('button');t.className='target';t.textContent='🎯';t.setAttribute('aria-label','Cible');
    t.onclick=()=>{score++;sc.textContent=score;place(t)};
    ar.appendChild(t);place(t);
    timer=setInterval(()=>{left--;tm.textContent=left;if(left<=0)end()},1000);
  };
  return ()=>clearInterval(timer);
}
</script>
</body>
</html>
